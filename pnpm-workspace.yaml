allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - markdown-exit@1.2.0

overrides:
  glob: '^13.0.6' # 统一版本
  markdown-it: 'npm:markdown-exit@^1.2.0' # 替换为高性能实现
  markdown-exit: '^1.2.0' # 替换为高性能实现
  sass: 'npm:sass-embedded@^1.100.0' # 替换为高性能实现
  # -----
  # 以下是为了修复 CVE-2026-44705
  'config-chain>ini': '^7.0.0'
  'global-modules>global-prefix': '^4.0.0'
  'global-prefix>ini': '^7.0.0'
  'package-json>registry-url': '^7.2.0' # 删除了 rc 依赖，rc 依赖旧版本 ini
  # -----
  'gray-matter>js-yaml': '^3.15.1' # 修复 CVE-2025-64718
  'firefox-profile>adm-zip': '^0.6.0' # 修复 CVE-2026-39244
  'web-ext>addons-linter': '-' # 用不到 web-ext 的格式化功能
  'fx-runner>shell-quote': '^1.10.0' # 修复 CVE-2026-13311
  'vue': 'rc'
  '@vue/compiler-core': 'rc'
  '@vue/compiler-dom': 'rc'
  '@vue/compiler-sfc': 'rc'
  '@vue/compiler-ssr': 'rc'
  '@vue/compiler-vapor': 'rc'
  '@vue/reactivity': 'rc'
  '@vue/runtime-core': 'rc'
  '@vue/runtime-dom': 'rc'
  '@vue/runtime-vapor': 'rc'
  '@vue/server-renderer': 'rc'
  '@vue/shared': 'rc'
  '@vue/compat': 'rc'

peerDependencyRules:
  allowAny:
    - 'vue'
