allowBuilds:
  esbuild: true

overrides:
  # glob: '^13.0.6' # 统一版本
  markdown-it: 'npm:markdown-exit@^1.3.0' # 替换为高性能实现
  # -----
  'ini': '^7.0.0'
  # 'config-chain>ini': '^7.0.0' # 修复 CVE-2020-7788
  'global-modules>global-prefix': '^4.0.0'
  # 'global-prefix>ini': '^7.0.0' # 修复 CVE-2020-7788
  # 'global-directory>ini': '^7.0.0' # 统一版本
  # 'firefox-profile>ini': '^7.0.0' # 统一版本
  'package-json>registry-url': '^7.2.0' # 删除了 rc 依赖，rc 依赖旧版本 ini
  # -----
  # 以下是为了修复 CVE-2021-3807
  'strip-ansi@5.2.0>ansi-regex': '4.1.1'
  'strip-ansi@6.0.0>ansi-regex': '5.0.1'
  # -----
  'gray-matter>js-yaml': '^3.15.2' # 修复 CVE-2025-64718
  'web-ext>addons-linter': '-' # 用不到 web-ext 的格式化功能
  'vue': 'rc'
  '@vue/compiler-core': 'rc'
  '@vue/compiler-dom': 'rc'
  '@vue/compiler-sfc': 'rc'
  '@vue/compiler-ssr': 'rc'
  '@vue/compiler-vapor': 'rc'
  '@vue/reactivity': 'rc'
  '@vue/runtime-core': 'rc'
  '@vue/runtime-dom': 'rc'
  '@vue/runtime-vapor': 'rc'
  '@vue/server-renderer': 'rc'
  '@vue/shared': 'rc'
  '@vue/compat': 'rc'

peerDependencyRules:
  allowAny:
    - 'vue'
